<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Shower</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Pantalla 1: El Sobre -->
    <div id="pantalla-sobre" class="pantalla activa">
        <div class="ilustracion-sobre">
            <!-- Aquí colocarás tu SVG estilo Winnie the Pooh -->
            <h2>¡Tienes una carta!</h2>
        </div>
        <input type="text" id="nombre-invitado" placeholder="Tu nombre (Ej. Javi)">
        <button id="btn-abrir">Abrir Invitación</button>
    </div>

    <!-- Agrega la etiqueta de audio antes de cerrar el body -->
    <audio id="musica-fondo" loop>
        <!-- Cambia "cancion.mp3" por el nombre real de tu archivo -->
        <source src="assets/cancion.mp3" type="audio/mpeg">
    </audio>

<!-- Pantalla 2: La Invitación (Oculta al inicio) -->
    <div id="pantalla-invitacion" class="pantalla oculta">
        <!-- Textos Principales -->
        <h3>BABY SHOWER</h3>
        <h1>Ketsia</h1>
        
        <h2 id="saludo-invitado">¡Hola!</h2>
        
        <!-- Reloj Regresivo -->
        <div id="contenedor-contador">
            <div class="bloque-tiempo">
                <span id="dias">00</span>
                <p>Días</p>
            </div>
            <div class="bloque-tiempo">
                <span id="horas">00</span>
                <p>Horas</p>
            </div>
            <div class="bloque-tiempo">
                <span id="minutos">00</span>
                <p>Min</p>
            </div>
            <div class="bloque-tiempo">
                <span id="segundos">00</span>
                <p>Seg</p>
            </div>
        </div>

        <div class="contenido-baby-shower">
            <p>Acompáñanos a celebrar la llegada de nuestra pequeña.</p>
        </div>

        <button id="btn-confirmar">Confirmar Asistencia</button>
    </div>

    <!-- Importante: type="module" permite usar "import" en tu archivo JS -->
    <script type="module" src="app.js"></script>
</body>
</html>
